name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run tells you nothing about the current commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify go.mod is tidy
        # Fails if go.mod/go.sum have drifted from the imports. A dirty module
        # file means someone committed code that will not build for anyone else.
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Unit tests with coverage
        run: |
          go test ./pkg/... ./services/... -covermode=atomic -coverprofile=coverage.out \
            -timeout 15m | tee unit-coverage.txt

      # Enforce a per-package coverage floor.
      #
      # Only packages that actually HAVE test files are held to the floor.
      # `-coverprofile` makes go test report 0.0% for a package with no tests
      # rather than "[no test files]", so the two cannot be told apart from the
      # test output alone - asking `go list` which packages have TestGoFiles is
      # the reliable way to separate them. Counting untested packages as 0%
      # dragged the aggregate to 45.8% for reasons unrelated to any
      # regression, which makes a gate that fails on its first run useless.
      # They are reported as a warning so the gap stays visible.
      - name: Enforce coverage floor
        run: |
          floor=60
          go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' \
            ./pkg/... ./services/... | grep -v '^$' | sort > tested-pkgs.txt
          echo "Holding $(wc -l < tested-pkgs.txt) tested packages to a ${floor}% floor."

          fail=0
          while read -r pkg; do
            pct=$(go tool cover -func=coverage.out 2>/dev/null \
              | grep -F "$pkg" \
              | awk '{gsub(/%/,"",$NF); print $NF}' | tail -1)
            [ -z "$pct" ] && continue
            if awk -v p="$pct" -v f="$floor" 'BEGIN{exit !(p+0 < f)}'; then
              echo "::error::$pkg is at ${pct}%, below the ${floor}% floor"
              fail=1
            fi
          done < tested-pkgs.txt

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          total=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          echo "Total coverage across all packages: ${total}%"
          untested=$(go list ./pkg/... ./services/... | sort \
            | comm -23 - tested-pkgs.txt)
          if [ -n "$untested" ]; then
            echo "::warning::No test files (not held to the floor):"
            echo "$untested" | sed 's/^/  /'
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  chaos:
    name: chaos suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      # The suite has its own contractual gate: it fails below 1000 cases and
      # on any dimension that registered zero. That gate lives in TestMain, so
      # running a subset with -run would fail by design - run it whole.
      - name: Run chaos suite with gate
        run: go test ./test/chaos/ -v -count=1 -timeout 25m

      - name: Run auth chaos suite with gate
        run: go test ./services/api-gateway/internal/middleware/ -v -count=1 -timeout 10m

      - name: Race detector on concurrency-sensitive packages
        run: |
          go test -race -timeout 20m \
            ./pkg/resilience/ \
            ./pkg/hardware/... \
            ./services/api-gateway/... \
            ./services/biometric-service/...

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      # A short fuzz run on each target. This is a smoke test that the targets
      # execute and the corpus loads, not a substitute for a long soak run.
      #
      # -short is required: the chaos suite's coverage gate lives in TestMain and
      # deliberately fails when the run is isolated, because a partial run is
      # exactly what the gate exists to catch. A fuzz target is by definition a
      # partial run, so it opts out. Coverage is enforced in the chaos job,
      # which runs the suite whole.
      - name: Fuzz targets smoke run
        run: |
          for target in FuzzCylinderDeserialise FuzzVaultDecrypt FuzzTemplatePipeline FuzzAPBStateMachine; do
            echo "::group::$target"
            go test ./test/chaos/ -short -run "XXX" -fuzz "^${target}$" -fuzztime 30s
            echo "::endgroup::"
          done

  build:
    name: container images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        service: [biometric-service, access-policy-service, edge-gateway-service, api-gateway]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Proves the Dockerfiles still build. Images are intentionally not
      # pushed: this is a build gate, not a release pipeline.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          push: false
          tags: anguli/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}