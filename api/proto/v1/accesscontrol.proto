syntax = "proto3";

package accesscontrol.v1;

option go_package = "finger-scanner/pkg/api/v1/accesscontrol;accesscontrolv1";

// AccessPolicyService manages access control decisions, security zones, and distributed anti-passback.
service AccessPolicyService {
  // EvaluateAccess checks credentials, zone clearance, active shifts, and anti-passback state.
  rpc EvaluateAccess(EvaluateAccessRequest) returns (EvaluateAccessResponse);

  // ConfigurePolicy updates access rules for specific roles or zones.
  rpc ConfigurePolicy(ConfigurePolicyRequest) returns (ConfigurePolicyResponse);

  // GetPolicy retrieves the policy definition for a zone.
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);

  // ResetAntiPassback resets anti-passback status for an employee.
  rpc ResetAntiPassback(ResetAntiPassbackRequest) returns (ResetAntiPassbackResponse);

  // RecordAccessEvents durably records door decisions made at an edge node.
  //
  // An edge buffers every turnstile decision while it is offline and forwards
  // them here on reconnect. Without this there is no central record of who was
  // let through which door, and the edge's local copy is the only one - which
  // is a single disk on a single machine, not an audit trail.
  //
  // Recording is idempotent on event_id, because replay after a partial failure
  // is the normal case rather than the exception: an edge that fails partway
  // through a batch must be able to retry it without double-counting.
  rpc RecordAccessEvents(RecordAccessEventsRequest) returns (RecordAccessEventsResponse);

  // QueryAccessEvents reads the central access audit trail.
  //
  // Recording without reading is only half a control: the trail would exist and
  // still be unanswerable, so "who entered which door, and when" would remain a
  // question nobody could ask the system.
  //
  // Results are newest first and paginated by a keyset cursor over
  // (occurred_unix, event_id) rather than an offset, so a replay arriving while
  // an operator pages through history cannot shift rows between pages and make
  // them skip or re-read an event.
  rpc QueryAccessEvents(QueryAccessEventsRequest) returns (QueryAccessEventsResponse);
}

// AccessEventOutcome filters the audit trail by result. An audit question is
// usually about one of them: a tailgater asks about grants, an investigation
// about a specific refusal.
enum AccessEventOutcome {
  ACCESS_EVENT_OUTCOME_UNSPECIFIED = 0;
  ACCESS_EVENT_OUTCOME_GRANTED = 1;
  ACCESS_EVENT_OUTCOME_DENIED = 2;
}

enum AccessDecision {
  ACCESS_DECISION_UNSPECIFIED = 0;
  ACCESS_DECISION_GRANTED = 1;
  ACCESS_DECISION_DENIED_INVALID_ZONE = 2;
  ACCESS_DECISION_DENIED_ANTI_PASSBACK = 3;
  ACCESS_DECISION_DENIED_SCHEDULE = 4;
  ACCESS_DECISION_DENIED_BIOMETRIC_MISMATCH = 5;
}

enum DoorDirection {
  DOOR_DIRECTION_UNSPECIFIED = 0;
  DOOR_DIRECTION_ENTRY = 1;
  DOOR_DIRECTION_EXIT = 2;
}

message EvaluateAccessRequest {
  string employee_id = 1;
  string zone_id = 2;
  string door_id = 3;
  DoorDirection direction = 4;
  bool biometric_verified = 5;
  double biometric_score = 6;
  int64 timestamp_unix = 7;
}

message EvaluateAccessResponse {
  AccessDecision decision = 1;
  bool is_granted = 2;
  string reason = 3;
  int64 relay_open_duration_ms = 4; // Solenoid unlock pulse duration (e.g. 2500ms)
}

message PolicyRule {
  string zone_id = 1;
  string allowed_role = 2;
  bool require_biometrics = 3;
  double min_biometric_score = 4; // e.g. 65.0
  bool enforce_anti_passback = 5;
  uint32 anti_passback_window_sec = 6; // e.g. 60 seconds
}

message ConfigurePolicyRequest {
  PolicyRule rule = 1;
}

message ConfigurePolicyResponse {
  bool success = 1;
  string message = 2;
}

message GetPolicyRequest {
  string zone_id = 1;
}

message GetPolicyResponse {
  bool found = 1;
  PolicyRule rule = 2;
}

message ResetAntiPassbackRequest {
  string employee_id = 1;
  string zone_id = 2;
}

message ResetAntiPassbackResponse {
  bool success = 1;
  string message = 2;
}

// AccessAuditEvent is one door decision, as observed by an edge node.
message AccessAuditEvent {
  // event_id is generated by the edge and is the idempotency key. Two replays
  // of the same event must record exactly one row.
  string event_id = 1;
  string turnstile_id = 2;
  string employee_id = 3;
  string zone_id = 4;
  // decision is the human-readable reason text produced at the edge.
  string decision = 5;
  // access_granted is the boolean outcome, kept separate from decision because
  // it is the field a report filters on.
  bool access_granted = 6;
  int64 occurred_unix = 7;
  // processed_offline records that the edge made this decision from cached
  // policy rather than a central call, which is material to any later audit.
  bool processed_offline = 8;
}

message RecordAccessEventsRequest {
  repeated AccessAuditEvent events = 1;
}

message RecordAccessEventsResponse {
  // recorded counts events newly stored. It can be lower than events were sent
  // when some were already present, which is the expected outcome of a retry.
  uint32 recorded = 1;
  // duplicates counts events skipped because their event_id was already
  // recorded.
  uint32 duplicates = 2;
}

// max_audit_query_limit bounds one page. A caller cannot ask for the whole
// trail in a single response and exhaust memory on a site with years of history.
message QueryAccessEventsRequest {
  // Empty means "any". Filters combine with AND.
  string employee_id = 1;
  string zone_id = 2;
  string turnstile_id = 3;
  // from_unix and to_unix bound the decision time, inclusive. Zero means unbounded.
  int64 from_unix = 4;
  int64 to_unix = 5;
  AccessEventOutcome outcome = 6;
  // limit is the page size. Zero selects the server default; values above the
  // server maximum are clamped rather than rejected.
  uint32 limit = 7;
  // page_token continues a previous query. Empty starts from the newest event.
  string page_token = 8;
}

message QueryAccessEventsResponse {
  // events are ordered newest first.
  repeated AccessAuditEvent events = 1;
  // next_page_token is empty when the result is exhausted.
  string next_page_token = 2;
}
