{{- $root := . -}}
{{- range $c := .Values.components }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "anguli.fullname" $root }}-{{ $c.name }}
  labels:
    {{- include "anguli.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
spec:
  type: ClusterIP
  selector:
    {{- include "anguli.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
  ports:
    - name: {{ if eq $c.healthScheme "http" }}http{{ else }}grpc{{ end }}
      port: {{ $c.port }}
      targetPort: {{ $c.port }}
      protocol: TCP
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "anguli.serviceAccountName" . }}
  labels:
    {{- include "anguli.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "anguli.fullname" . }}-data
  labels:
    {{- include "anguli.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "anguli.fullname" . }}
  labels:
    {{- include "anguli.labels" . | nindent 4 }}
  {{- with .Values.podDisruptionBudgetAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # minAvailable rather than maxUnavailable: a node drain must never take the
  # last serving replica of a door controller offline.
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "anguli.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "anguli.fullname" . }}
  labels:
    {{- include "anguli.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "anguli.fullname" . }}-api-gateway
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}